name: Release — Deploy to Staging & Production

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ===========================================================================
  # 1. Build & Tag Release Image
  # ===========================================================================
  build-release-image:
    name: Build Release Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and Push Release Image
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # 2. Deploy to Staging
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-release-image
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/tallyme-staging
            echo "IMAGE_TAG=${{ needs.build-release-image.outputs.image_tag }}" > .image_tag.env
            docker compose -f docker-compose.staging.yml --env-file .env.staging pull
            docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --remove-orphans
            docker compose -f docker-compose.staging.yml exec backend-api npx prisma migrate deploy

      - name: Validate Staging Health
        run: |
          sleep 15
          status=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.STAGING_URL }}/api/v1/health/ready)
          if [ "$status" != "200" ]; then
            echo "Staging health check failed with status $status"
            exit 1
          fi
          echo "Staging is healthy (200)"

      - name: Run Automation Validation on Staging
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/tallyme-staging
            docker compose -f docker-compose.staging.yml exec backend-api node validate_automations.js

  # ===========================================================================
  # 3. Manual Approval Gate — Production
  # ===========================================================================
  approve-production:
    name: Await Production Approval
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production-gate
    steps:
      - name: Approved
        run: echo "Production deployment approved."

  # ===========================================================================
  # 4. Deploy to Production
  # ===========================================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: approve-production
    environment:
      name: production
      url: ${{ secrets.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/tallyme
            # Take a DB backup before deploying
            ./scripts/backup-db.sh
            # Pull and deploy
            echo "IMAGE_TAG=${{ needs.build-release-image.outputs.image_tag }}" > .image_tag.env
            docker compose -f docker-compose.prod.yml --env-file .env pull
            docker compose -f docker-compose.prod.yml --env-file .env up -d --remove-orphans
            docker compose -f docker-compose.prod.yml exec backend-api npx prisma migrate deploy

      - name: Validate Production Health
        run: |
          sleep 20
          status=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.PRODUCTION_URL }}/api/v1/health/ready)
          if [ "$status" != "200" ]; then
            echo "Production health check FAILED with status $status — triggering rollback notification"
            exit 1
          fi
          echo "Production is healthy (200)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            CHANGELOG.md