name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint
      working-directory: ./apps/backend

    - name: Run Tests
      run: npm test
      working-directory: ./apps/backend

    - name: Prisma Validate & Migration Check
      run: |
        npx prisma validate
        npx prisma migrate status
      working-directory: ./apps/backend
      env:
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test_db"
        
    - name: Build
      run: npm run build
      working-directory: ./apps/backend

    - name: Build and Push Docker Image
      env:
        GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Building production image..."
        docker build -t ghcr.io/tallyme/backend:latest -f apps/backend/Dockerfile .
        # Uncomment to enable push to GHCR:
        # echo $GHCR_PAT | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        # docker push ghcr.io/tallyme/backend:latest
