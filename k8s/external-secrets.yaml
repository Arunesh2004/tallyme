apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: tallyme
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: tallyme-api-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tallyme-secrets-external
  namespace: tallyme
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: tallyme-secrets
    creationPolicy: Owner
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: tallyme/production
      property: DATABASE_URL
  - secretKey: REDIS_HOST
    remoteRef:
      key: tallyme/production
      property: REDIS_HOST
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: tallyme/production
      property: REDIS_PASSWORD
  - secretKey: JWT_SECRET
    remoteRef:
      key: tallyme/production
      property: JWT_SECRET
  - secretKey: ENCRYPTION_KEY
    remoteRef:
      key: tallyme/production
      property: ENCRYPTION_KEY
  - secretKey: AI_API_KEY
    remoteRef:
      key: tallyme/production
      property: AI_API_KEY
  - secretKey: GMAIL_CLIENT_ID
    remoteRef:
      key: tallyme/production
      property: GMAIL_CLIENT_ID
  - secretKey: GMAIL_CLIENT_SECRET
    remoteRef:
      key: tallyme/production
      property: GMAIL_CLIENT_SECRET
  - secretKey: GMAIL_REFRESH_TOKEN
    remoteRef:
      key: tallyme/production
      property: GMAIL_REFRESH_TOKEN
  - secretKey: GMAIL_ACCOUNT
    remoteRef:
      key: tallyme/production
      property: GMAIL_ACCOUNT
  - secretKey: SENTRY_DSN
    remoteRef:
      key: tallyme/production
      property: SENTRY_DSN
