global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    project: 'tallyme'

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # ---- TallyMe API ----
  - job_name: 'tallyme-api'
    static_configs:
      - targets: ['backend-api:3000']
    metrics_path: '/api/v1/metrics'
    scrape_interval: 15s

  # ---- TallyMe Worker ----
  - job_name: 'tallyme-worker'
    static_configs:
      - targets: ['backend-worker:3001']
    metrics_path: '/api/v1/metrics'
    scrape_interval: 15s

  # ---- PostgreSQL (via postgres_exporter) ----
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # ---- Redis (via redis_exporter) ----
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  # ---- Nginx ----
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 30s

  # ---- Node Exporter (system metrics) ----
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # ---- Prometheus self-monitoring ----
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
