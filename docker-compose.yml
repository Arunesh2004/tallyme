version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: tallyme-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://tallyme:tallypass@postgres:5432/tallymedb?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - tallyme-uploads:/usr/src/app/apps/backend/storage

  postgres:
    image: postgres:15-alpine
    container_name: tallyme-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=tallyme
      - POSTGRES_PASSWORD=tallypass
      - POSTGRES_DB=tallymedb
    ports:
      - "5432:5432"
    volumes:
      - tallyme-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallyme -d tallymedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tallyme-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - tallyme-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tallyme-pgdata:
  tallyme-redisdata:
  tallyme-uploads:
